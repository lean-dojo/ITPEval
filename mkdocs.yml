site_name: ITPEval
site_description: Python tools for native theorem proving, evaluation and learning.
repo_url: https://github.com/lean-dojo/ITPEval
copyright: © 2026 Jiayi Wu, Robert Joseph George, and Anima Anandkumar
docs_dir: docs
site_dir: website/dist
strict: true
theme:
  name: null
  custom_dir: website/theme
  static_templates: []
plugins:
  - search
hooks:
  - website/hooks.py
  - website/proof_listings.py
exclude_docs: |
  *.py
not_in_nav: |
  /search.md
markdown_extensions:
  - md_in_html
  - tables
  - def_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      pygments_lang_class: true
      css_class: codehilite
  - pymdownx.superfences
  - toc:
      permalink: false
nav:
