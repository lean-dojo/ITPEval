<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
* { box-sizing: border-box; }
body { margin: 0; color: #202623; font-family: DocSans, sans-serif; }
main {
  --accent: #225695;
  width: 960px; height: 540px; display: grid; grid-template-rows: 87px 262px 1fr;
  gap: 14px; padding: 14px 30px 25px; background: #f6f5ef;
  border-top: 8px solid var(--accent);
}
header, .source-bar, .record { display: flex; align-items: center; }
header { gap: 19px; }
#logo { max-width: 92px; height: 51px; object-fit: contain; }
#logo.wordmark { max-width: 220px; height: 73px; object-position: left center; }
#name { font-size: 48px; font-weight: 600; letter-spacing: -2px; }
#position { margin-left: auto; font: 24px DocMono, monospace; color: var(--accent); }
.source { display: flex; flex-direction: column; border: 1px solid #c6c9be; border-radius: 10px; overflow: hidden; background: #fff; }
.source-bar { justify-content: space-between; padding: 8px 20px; border-bottom: 1px solid #dfe1d8; background: #f3f4ec; }
#file { font: 25px DocMono, monospace; }
#scope { color: #4d554c; font-size: 22px; }
pre { margin: auto 0; padding: 5px 20px; white-space: pre-wrap; overflow-wrap: anywhere; font: 28px/1.17 DocMono, monospace; }
#note { display: block; color: #445e4b; font: italic 21px/1.18 DocMono, monospace; margin-bottom: 6px; }
mark { background: transparent; color: var(--accent); font-weight: 600; }
.record { justify-content: space-between; gap: 18px; padding-left: 17px; border-left: 5px solid var(--accent); }
.label { display: block; margin-bottom: 7px; color: #50594f; font-size: 22px; }
#declaration { font: 27px DocMono, monospace; }
#status { color: var(--accent); font: 23px DocMono, monospace; }
</style>
<main>
  <header><img id="logo" alt=""><strong id="name"></strong><span id="position"></span></header>
  <section class="source">
    <div class="source-bar"><span id="file"></span><span id="scope"></span></div>
    <pre><span id="note"></span><span id="code"></span></pre>
  </section>
  <section class="record">
    <div><span class="label">Extracted declaration</span><span id="declaration"></span></div>
    <div><span class="label">Checking status</span><span id="status"></span></div>
  </section>
</main>
<script>
const byId = id => document.getElementById(id);

async function selectScene(scene, index, count) {
  document.querySelector("main").style.setProperty("--accent", scene.accent);
  const logo = byId("logo");
  const showWordmark = Boolean(scene.image && scene.wordmark);
  logo.hidden = !scene.image;
  logo.classList.toggle("wordmark", showWordmark);
  logo.alt = showWordmark ? scene.name : "";
  if (scene.image) {
    logo.src = scene.image;
    await logo.decode();
  }
  byId("name").textContent = scene.name;
  byId("name").hidden = showWordmark;
  byId("position").textContent = (index + 1) + " / " + count;
  byId("file").textContent = scene.file;
  byId("scope").textContent = scene.files + " project files · " + scene.declarations + " declarations";
  byId("note").textContent = scene.note;

  // Preserve the original source around the declaration being extracted.
  const start = scene.source.indexOf(scene.symbol);
  const highlighted = document.createElement("mark");
  highlighted.textContent = scene.symbol;
  byId("code").replaceChildren(scene.source.slice(0, start), highlighted,
    scene.source.slice(start + scene.symbol.length));
  byId("declaration").textContent = scene.declaration;
  byId("status").textContent = scene.status;
}
function drawFrame(seconds) {
  // Keep the source steady while its extracted record appears below.
  const progress = Math.min(1, Math.max(0, (seconds - 0.55) / 0.32));
  const record = document.querySelector(".record");
  record.style.opacity = progress;
  record.style.transform = "translateY(" + (1 - progress) * 7 + "px)";
}
</script>
</html>
