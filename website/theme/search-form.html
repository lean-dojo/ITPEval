<form action="{{ 'search/'|url }}" role="search" class="search-field">
  {{ icon('search', 20) }}<input type="search" id="query" name="q" placeholder="Search guides, APIs, or prover libraries" aria-label="Search documentation" autocomplete="off" autofocus>
  <button type="submit" class="btn primary">Search</button>
</form>
<p id="search-status" role="status" aria-live="polite"></p>
<div id="search-results"></div>
<div id="search-directory">
  <noscript><p>Use your browser’s Find command to search the page directory below.</p></noscript>
  <h2>Browse documentation</h2>
  {% for group in nav if group.children %}<h3>{{ group.title }}</h3><ul>
    {% for item in group.children %}<li><a href="{{ landing_url(item)|url }}">{{ item.title }}</a></li>{% endfor %}
  </ul>{% endfor %}
</div>
