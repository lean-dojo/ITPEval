name: ITPEval conformance
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 1'

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -U setuptools wheel
      - run: python -m pip install ".[parquet,training,isabelle]"
      - run: python -m unittest discover -s itpeval/tests
      - run: python -m unittest discover -s eval/pipeline/tests
      - run: python -m unittest discover -s scripts/tests
      - run: |
          python -m scripts.check_release benchmarks/runtime/qualification.jsonl
          python -m scripts.generate_capabilities
          git diff --exit-code -- docs/provers docs/reference/capabilities.md
      - run: python -m scripts.check_distribution --dist-dir "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: ${{ runner.temp }}/dist
      - run: python -m eval.pipeline.translation.run --sources babel-formal --ids 1 --src lean4 --tgt pvs --model gpt-5.5 --dry-run

  native-selection:
    runs-on: ubuntu-24.04
    outputs:
      provers: ${{ steps.selection.outputs.provers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: selection
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from itpeval.backends.registry import prover_ids
          ids = prover_ids()
          event = os.environ["GITHUB_EVENT_NAME"]
          base = os.environ["BASE"]
          selected = set()
          if event in {"schedule", "workflow_dispatch"} or os.environ["GITHUB_REF"].startswith("refs/tags/") or not base or set(base) == {"0"}:
              selected.update(ids)
          else:
              changed = subprocess.check_output(["git", "diff", "--name-only", "--no-renames", base, "HEAD"], text=True).splitlines()
              for path in changed:
                  if path.startswith("itpeval/provers/") and path.split("/")[2] in ids:
                      selected.add(path.split("/")[2])
                  elif path.startswith(("itpeval/", "scripts/", "eval/", "benchmarks/runtime/", "docs/", "data/", ".github/workflows/")) or path in {"pyproject.toml", "README.md", "MANIFEST.in"}:
                      selected.update(ids)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print("provers=" + json.dumps(sorted(selected)), file=out)
          PY

  native:
    needs: [python, native-selection]
    if: needs.native-selection.outputs.provers != '[]'
    strategy:
      fail-fast: false
      matrix:
        prover: ${{ fromJSON(needs.native-selection.outputs.provers) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      ITPEVAL_PREFIX: ${{ github.workspace }}/itpeval/_toolchains
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgmp-dev ocaml camlp5 ocaml-findlib libzarith-ocaml-dev rsync m4 unzip pkg-config sbcl polyml emacs-nox libpcre2-dev xdot libipc-system-simple-perl libstring-shellquote-perl elan
      - run: python -m itpeval.environments.install --prefix "$ITPEVAL_PREFIX" --cache "$RUNNER_TEMP/downloads" "${{ matrix.prover }}"
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: ${{ runner.temp }}/dist
      - run: python -m pip install --no-deps "$RUNNER_TEMP"/dist/*.whl
      - if: matrix.prover == 'lean4'
        uses: actions/checkout@v4
        with:
          repository: leanprover/Pantograph
          ref: 0ee70917fb93a5421157119362ecde806a4d881b
          path: integrations/Pantograph
          persist-credentials: false
      - if: matrix.prover == 'lean4'
        uses: actions/checkout@v4
        with:
          repository: lean-dojo/LeanDojo-v2
          ref: f3b01b180e7429ed5389c2409ed14ce9ede93987
          path: integrations/LeanDojo-v2
          persist-credentials: false
      - if: matrix.prover == 'lean4'
        run: python scripts/install_optional_runtime.py lean4 --prefix "$ITPEVAL_PREFIX" --pantograph integrations/Pantograph --leandojo integrations/LeanDojo-v2
      - if: matrix.prover == 'rocq'
        run: |
          opam_bin="$ITPEVAL_PREFIX/rocq/bin/opam"
          if [ ! -x "$opam_bin" ]; then opam_bin="$(command -v opam)"; fi
          export OPAMROOT="$ITPEVAL_PREFIX/rocq/opamroot"
          "$opam_bin" switch create itpeval-petanque ocaml-base-compiler.4.14.2 --jobs=2 -y
          "$opam_bin" install --switch itpeval-petanque -y --jobs=2 rocq-runtime.9.1.1 coq-lsp.0.2.5+9.1
          python scripts/install_optional_runtime.py rocq --prefix "$ITPEVAL_PREFIX" --opam-switch "$("$opam_bin" var --switch itpeval-petanque prefix)"
      - if: matrix.prover == 'isabelle'
        uses: actions/checkout@v4
        with:
          repository: xqyww123/Isa-REPL
          ref: 141083616134af3629ef07137ffe07f098ab8ee2
          path: integrations/isa_repl
          persist-credentials: false
      - if: matrix.prover == 'isabelle'
        uses: actions/checkout@v4
        with:
          repository: xqyww123/auto_sledgehammer
          ref: c226522e5744f7c3a06864789a475053c9dd93b6
          path: integrations/auto_sledgehammer
          persist-credentials: false
      - if: matrix.prover == 'isabelle'
        run: python -m pip install 'msgpack>=1,<2'
      - if: matrix.prover == 'metamath'
        run: |
          python -m pip install 'torch==2.11.0' --index-url https://download.pytorch.org/whl/cpu
          wheel=("$RUNNER_TEMP"/dist/*.whl)
          python -m pip install "${wheel[0]}[grpo]"
          python -m scripts.check_readme
      - if: matrix.prover == 'lean4'
        run: python website/check.py --native-quickstart
      - run: |
          python -m scripts.check_distribution --from-dist "$RUNNER_TEMP/dist" --native-report "$RUNNER_TEMP/native/qualification.jsonl" --cache "$RUNNER_TEMP/prepared" --prover "${{ matrix.prover }}"
          python -m scripts.qualify_native --distributions "$RUNNER_TEMP/dist" --prefix "$ITPEVAL_PREFIX" --cache "$RUNNER_TEMP/prepared" --output "$RUNNER_TEMP/native" --prover "${{ matrix.prover }}" --isa-integrations "$GITHUB_WORKSPACE/integrations"
          python -m scripts.check_release "$RUNNER_TEMP/native/qualification.jsonl" --prover "${{ matrix.prover }}" --distributions "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.prover }}-evidence
          path: ${{ runner.temp }}/native

  release:
    needs: native
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-evidence'
          path: native-reports
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: ${{ runner.temp }}/dist
      - run: python -m scripts.check_release native-reports/*/qualification.jsonl --distributions "$RUNNER_TEMP/dist"
