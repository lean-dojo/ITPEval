[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itpeval"
version = "0.2.0.dev1"
readme = "README.md"
requires-python = ">=3.10"
description = "Native theorem prover environments, verification, and formal translation evaluation"
authors = [
    { name = "Jiayi Wu", email = "jiayi_wu4@brown.edu" },
    { name = "Robert Joseph George" },
    { name = "Anima Anandkumar" },
]
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
training = ["datasets>=2"]
grpo = ["trl==1.0.0", "transformers>=4.57,<5", "torch>=2.3", "datasets>=4.7"]
parquet = ["pyarrow>=14"]
isabelle = ["msgpack>=1,<2"]
evaluation = [
    "anthropic",
    "google-genai",
    "httpx",
    "openai",
    "python-dotenv",
    "requests",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["eval*", "itpeval*"]
namespaces = false

[tool.setuptools.package-data]
eval = ["benchmark-lock.json"]
itpeval = [
    "manifest.json", "bin/*.sh", "bin/itpeval",
    "provers/*/*.sh", "provers/*/adapter.json", "provers/*/hello/**/*",
    "tasks/*/task.json", "tasks/*/**/*", "core/*.json", "core/schemas/*.json",
    "environments/*.json", "extraction/native/*", "semantics/*.lean",
    "backends/*/*.json", "backends/*/*.ml", "backends/*/*.sml",
    "backends/*.json", "tests/fixtures/projects/**/*",
]

[project.scripts]
itpeval = "itpeval.cli.main:main"
